version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '14:00'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '14:00'
    groups:
      codeql:
        patterns:
          - github/codeql-action*
    cooldown:
      default-days: 7
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '14:00'
    cooldown:
      default-days: 7
    ignore:
      # libmaxminddb is pinned to release tags and compiled into our wheels.
      # Dependabot moves submodules to the latest commit on the tracked branch
      # when no newer tag exists, which would take us off release tags.
      - dependency-name: extension/libmaxminddb
